name: Android release APKs

# Builds signed, production-flavoured APKs and attaches them to a GitHub
# release. Push a tag (for example `v1.0.2`) to cut a release, or run the
# workflow by hand for a build-only artifact or to publish an existing tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (leave empty to build artifacts only)'
        required: false
        type: string
      build_number:
        description: 'Android versionCode override (default: 1000 + GitHub run number)'
        required: false
        type: string
      draft:
        description: 'Create the GitHub release as a draft'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-apks:
    name: Build and release Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the release ref
        uses: actions/checkout@v4
        with:
          # A manual run may name a tag; a tag push checks out that tag.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version and release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag=''
          if [ -n "${{ inputs.tag }}" ]; then
            tag='${{ inputs.tag }}'
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi

          if [ -n "$tag" ]; then
            version="${tag#v}"
          else
            version="$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1)"
          fi
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::Invalid version name '$version'. Use a tag like v1.2.3."
            exit 1
          fi

          if [ -n "${{ inputs.build_number }}" ]; then
            version_code='${{ inputs.build_number }}'
          else
            # 1000 + the workflow run number: above the historical pubspec
            # build numbers (300+) and unique for every build.
            version_code="$((1000 + GITHUB_RUN_NUMBER))"
          fi
          if [[ ! "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid versionCode '$version_code'. Use a positive whole number."
            exit 1
          fi

          {
            echo "RELEASE_TAG=$tag"
            echo "VERSION=$version"
            echo "VERSION_CODE=$version_code"
          } >> "$GITHUB_ENV"
          echo "Building Go Dutch $version (versionCode $version_code, run #$GITHUB_RUN_NUMBER) for tag '${tag:-none}'"
          {
            echo "### Go Dutch $version"
            echo
            echo "- Version name: \`$version\`"
            echo "- Version code: \`$version_code\` (GitHub run #$GITHUB_RUN_NUMBER)"
            echo "- Release tag: \`${tag:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stamp the app version into pubspec.yaml
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ["VERSION"]
          code = os.environ["VERSION_CODE"]
          path = pathlib.Path("pubspec.yaml")
          text = path.read_text()
          text, count = re.subn(
              r"(?m)^version:\s*.*$", f"version: {version}+{code}", text, count=1)
          if count != 1:
              raise SystemExit("pubspec.yaml has no version line")
          path.write_text(text)
          PY
          grep -E '^version:' pubspec.yaml

      - name: Install dependencies and generate code
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Configure Android upload key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret $name."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the four Android signing secrets described in SETUP.md before releasing."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          chmod 600 android/upload-keystore.jks
          printf '%s\n' \
            'storeFile=upload-keystore.jks' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > android/key.properties
          chmod 600 android/key.properties

      - name: Build universal release APK
        run: |
          flutter build apk \
            --release \
            --flavor prod \
            --build-name "$VERSION" \
            --build-number "$VERSION_CODE"

      - name: Build per-ABI release APKs
        run: |
          flutter build apk \
            --release \
            --flavor prod \
            --split-per-abi \
            --build-name "$VERSION" \
            --build-number "$VERSION_CODE"

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          src=build/app/outputs/flutter-apk
          cp "$src/app-prod-release.apk" "dist/godutch-${VERSION}-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f "$src/app-${abi}-prod-release.apk"
            cp "$src/app-${abi}-prod-release.apk" \
              "dist/godutch-${VERSION}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS)
          ls -lh dist

      - name: Verify the APK carries the tag version and run version code
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          aapt="$(find "$sdk/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$aapt"
          apk="dist/godutch-${VERSION}-universal.apk"
          "$aapt" dump badging "$apk" | head -1 > /tmp/badging.txt
          cat /tmp/badging.txt
          grep -Fq "versionCode='${VERSION_CODE}'" /tmp/badging.txt
          grep -Fq "versionName='${VERSION}'" /tmp/badging.txt

      - name: Check the APKs are signed with the upload key
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$apksigner"
          for apk in dist/*.apk; do
            "$apksigner" verify --print-certs "$apk" | sed -n '1,4p'
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godutch-${{ env.VERSION }}-android-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Go Dutch ${{ env.VERSION }}
          body: |
            Signed Android release APKs for Go Dutch ${{ env.VERSION }}.

            Version name: `${{ env.VERSION }}` · version code: `${{ env.VERSION_CODE }}` (GitHub run #${{ github.run_number }}).

            - `godutch-${{ env.VERSION }}-universal.apk` — one APK for every device
            - `godutch-${{ env.VERSION }}-arm64-v8a.apk` — most modern phones
            - `godutch-${{ env.VERSION }}-armeabi-v7a.apk` — older 32-bit phones
            - `godutch-${{ env.VERSION }}-x86_64.apk` — x86 emulators/devices

            Verify a download with `SHA256SUMS`. The APKs use the production
            application id (`com.dwprod.godutch`) and the project's upload key.
          files: dist/*
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android/upload-keystore.jks android/key.properties
